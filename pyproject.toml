[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "safe-to-be-challenged"
version = "0.1.0"
description = "Memo W9 integration: skill-diagnostic committee + harmlessness monitor + MACSS corpus + GitHub validation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.25.0",
    "beautifulsoup4>=4.12.0",
    "sentence-transformers>=2.2.0",
    "transformers>=4.36.0",
    "accelerate>=0.25.0",
    "bitsandbytes>=0.41.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.13.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
presentations = ["mcp-pptx-tools>=1.0.0"]

[tool.setuptools.packages.find]
where = ["src"]
